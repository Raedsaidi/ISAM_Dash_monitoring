version: "3.9"

services:
  # ---------- Base de données MySQL ----------
  db:
    image: mysql:8.0              # ou mariadb:10.11 si tu préfères
    container_name: isam-dash-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: isam_dash   # base commune pour auth + isam
      MYSQL_USER: pfe_user
      MYSQL_PASSWORD: pfe_pass
    ports:
      - "3307:3306"               # port externe 3307 -> port interne 3306
    volumes:
      - db_data:/var/lib/mysql

  # ---------- Auth-service ----------
  auth-service:
    build: ./auth-service
    container_name: auth-service-container
    ports:
      - "9000:9000"
    environment:
      # Ancienne config SQLite (gardée en commentaire)
      # - DB_URL=sqlite:///./auth.db

      # Nouvelle config MySQL (via conteneur "db")
      - DB_URL=mysql+pymysql://pfe_user:pfe_pass@db:3306/isam_dash

      - JWT_SECRET_KEY=GfN4v8jKQyG8p0LpjJ7dYQH9q2sLAX7m0pW3sZrTn9uN3xCyBh3FgTzW9Lk5QsM2
      - JWT_ALGORITHM=HS256
    depends_on:
      - db
    # volumes:
    #   - ./auth-service/data:/app  # si tu veux persister d'autres données

  # ---------- ISAM-service ----------
  isam-service:
    build: ./isam-service
    container_name: isam-service-container
    ports:
      - "8001:8001"
    environment:
      # Ancienne config SQLite (gardée en commentaire)
      # - DB_URL=sqlite:///./isam.db

      # Nouvelle config MySQL
      - DB_URL=mysql+pymysql://pfe_user:pfe_pass@db:3306/isam_dash

      # URL d'auth-service dans le réseau Docker
      - AUTH_SERVICE_URL=http://auth-service:9000

      - JWT_SECRET_KEY=GfN4v8jKQyG8p0LpjJ7dYQH9q2sLAX7m0pW3sZrTn9uN3xCyBh3FgTzW9Lk5QsM2
      - JWT_ALGORITHM=HS256
    depends_on:
      - db
      - auth-service
    # volumes:
    #   - ./isam-service/data:/app  # si tu veux persister d'autres données

  # ---------- Frontend ----------
  frontend:
    build: ./frontend
    container_name: isam-frontend-container
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - isam-service

volumes:
  db_data: