services:
  auth-service:
    environment:
      - DB_URL=mysql+pymysql://pfe_user:pfe_pass@shared-mysql:3306/isam_dash
      #                                           ↑ shared container name
    networks:
      - shared_infra_network
      - isam_network

  isam-service:
    environment:
      - DB_URL=mysql+pymysql://pfe_user:pfe_pass@shared-mysql:3306/isam_dash
    networks:
      - shared_infra_network
      - isam_network

  cisco-services:
    environment:
      - DB_URL=mysql+pymysql://pfe_user:pfe_pass@shared-mysql:3306/isam_dash
    networks:
      - shared_infra_network
      - isam_network

  frontend:
    networks:
      - isam_network

  db-backup:
    environment:
      DB_HOST: shared-mysql    # ← shared container name
    networks:
      - shared_infra_network
      - isam_network

networks:
  shared_infra_network:
    external: true
    name: shared_infra_network
  isam_network:
    name: isam_network
    driver: bridge