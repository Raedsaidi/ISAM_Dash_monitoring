services:
  # ── MySQL ──
  db:
    image: mysql:8.0
    container_name: isam-dash-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: isam_dash
      MYSQL_USER: pfe_user
      MYSQL_PASSWORD: pfe_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "pfe_user",
          "-ppfe_pass",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Auth-service ──
  auth-service:
    build: ./auth-service
    container_name: auth-service-container
    ports:
      - "9000:9000"
    environment:
      - DB_URL=mysql+pymysql://pfe_user:pfe_pass@db:3306/isam_dash
      - JWT_SECRET_KEY=GfN4v8jKQyG8p0LpjJ7dYQH9q2sLAX7m0pW3sZrTn9uN3xCyBh3FgTzW9Lk5QsM2
      - JWT_ALGORITHM=HS256
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # ── ISAM-service ──
  isam-service:
    build: ./isam-service
    container_name: isam-service-container
    ports:
      - "8001:8001"
    environment:
      - DB_URL=mysql+pymysql://pfe_user:pfe_pass@db:3306/isam_dash
      - AUTH_SERVICE_URL=http://auth-service:9000
      - JWT_SECRET_KEY=GfN4v8jKQyG8p0LpjJ7dYQH9q2sLAX7m0pW3sZrTn9uN3xCyBh3FgTzW9Lk5QsM2
      - JWT_ALGORITHM=HS256
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: on-failure

  # ── Cisco-service (NEW — same pattern as isam-service) ──
  cisco-services:
    build:
      context: ./cisco-services
      dockerfile: Dockerfile
    container_name: cisco-services
    ports:
      - "8002:8002"
    environment:
      - DB_URL=mysql+pymysql://pfe_user:pfe_pass@db:3306/isam_dash
      - AUTH_SERVICE_URL=http://auth-service:9000
      - JWT_SECRET_KEY=GfN4v8jKQyG8p0LpjJ7dYQH9q2sLAX7m0pW3sZrTn9uN3xCyBh3FgTzW9Lk5QsM2
      - JWT_ALGORITHM=HS256
      - CISCO_CONNECTION_TIMEOUT=15
      - CISCO_COMMAND_TIMEOUT=30
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_AUTH_BASE_URL=http://127.0.0.1:9000
        - VITE_ISAM_BASE_URL=http://127.0.0.1:8001
        - VITE_CISCO_BASE_URL=http://127.0.0.1:8002
    container_name: isam-frontend-container
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - isam-service
      - cisco-services
    restart: on-failure

volumes:
  db_data:
